# Clawix Production Docker Compose
# Usage:
#   Build:  docker compose -f docker-compose.prod.yml build
#   Start:  docker compose -f docker-compose.prod.yml up -d
#   Logs:   docker compose -f docker-compose.prod.yml logs -f
#   Stop:   docker compose -f docker-compose.prod.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: lightchurch-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5443:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clawix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clawix}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lightchurch-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6390:6379'
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    # Project-scoped tag: other Clawix checkouts on the same host use
    # clawix-api:latest, and a shared tag would swap their code for ours.
    image: lightchurch-api:latest
    container_name: lightchurch-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Host port movable with LIGHTCHURCH_API_PORT (scripts read the same var).
      - '127.0.0.1:${LIGHTCHURCH_API_PORT:-3001}:3003'
    env_file: .env
    environment:
      NODE_ENV: production
      # Owner login: used only by entrypoint.sh for migrations and bootstrap.
      DATABASE_URL: postgresql://${POSTGRES_USER:-clawix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-clawix}?schema=public
      # Everyday login the API runs as (rows only, append-only audit log) —
      # see infra/docker/api/db-roles.cjs. Empty password = keep using the owner.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      DATABASE_APP_URL: postgresql://lightchurch_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-clawix}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: '3003'
      HOST: '0.0.0.0'
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?PROVIDER_ENCRYPTION_KEY is required (64 hex chars)}
      # Bootstrap (optional — consumed by dist/bootstrap.js on first start,
      # skipped silently if INITIAL_ADMIN_EMAIL is empty)
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gpt-5}
      TEMPLATES_DIR: /app/infra/templates
      WORKSPACE_BASE_PATH: /data
      WORKSPACE_HOST_BASE_PATH: ${CLAWIX_HOST_DATA_DIR:-${PWD}/data}
      SKILLS_BUILTIN_DIR: /app/skills/builtin
      SKILLS_BUILTIN_HOST_DIR: ${CLAWIX_HOST_SKILLS_BUILTIN_DIR:-${PWD}/skills/builtin}
      SKILLS_CUSTOM_DIR: /app/skills/custom
      SKILLS_CUSTOM_HOST_DIR: ${CLAWIX_HOST_SKILLS_CUSTOM_DIR:-${PWD}/skills/custom}
      # WhatsApp Baileys auth state — written under the persistent /data mount
      # so the QR pairing survives container restarts.
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
      # Talking Face sidecars — optional; leave the cartoonize service
      # commented out below and this URL unset if you don't need it.
      CARTOONIZE_URL: ${CARTOONIZE_URL:-http://cartoonize:7861}
      # Local model (Ollama) for Roll Call's AI — member names never go to a
      # cloud provider. Inside the container "localhost" is the container, so
      # the default reaches Ollama on the Docker host.
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5vl:7b}
    # Makes host.docker.internal resolve on Linux too (Docker Desktop has it).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./skills/builtin:/app/skills/builtin:ro
      - ./skills/custom:/app/skills/custom
      - ./infra/templates:/app/infra/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - clawix-browser-egress

  clawix-browser:
    image: ghcr.io/browserless/chromium:latest
    container_name: lightchurch-browser
    restart: unless-stopped
    user: '1000:1000'
    # Note: read_only: true breaks Chromium 1217+ — its crashpad handler
    # subprocess loses argv when the rootfs is read-only, causing
    # `chrome_crashpad_handler: --database is required` and aborting launch.
    # Other isolation (non-root user, cap_drop, no-new-privileges, internal
    # egress network, resource limits) still applies.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt:
      - no-new-privileges
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 200
    shm_size: 256m
    environment:
      MAX_CONCURRENT_SESSIONS: '${BROWSER_SIDECAR_MAX_SESSIONS:-25}'
      TOKEN: '${BROWSER_AUTH_TOKEN}'
      # Disable Browserless' built-in queue; we queue at the API layer.
      QUEUED: '0'
      HEALTHCHECK: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - "http://127.0.0.1:3000/active?token=$$TOKEN"']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - clawix-browser-egress
      - clawix-browser-net

  # Optional: selfie -> cartoon/anime portrait for the talking-face pipeline
  # (docs/self2talkface.md). Not started by default — uncomment to enable,
  # and set CARTOONIZE_URL=http://cartoonize:7861 above if you change the
  # default. Build once (~tens of MB of model weights, unlike sadtalker):
  #   docker compose -f docker-compose.prod.yml build cartoonize
  # cartoonize:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/cartoonize/Dockerfile
  #   image: clawix-cartoonize:latest
  #   container_name: lightchurch-cartoonize
  #   restart: unless-stopped
  #   environment:
  #     CARTOONIZE_DEVICE: cpu # or cuda
  #   networks:
  #     - default
  #   # GPU (uncomment if using a CUDA build):
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

  # Get in Bible (reference/GetinBible) — self-hosted instead of Vercel, with
  # its own local Supabase (db + rest + storage below). The getinbible server
  # is the only way in: it serves the app, its AI proxies, and forwards
  # /rest/v1 + /storage/v1 to Supabase (the job Kong does upstream).
  # Embedded by the web dashboard at Scripture & Learning → Get in Bible.
  # Secrets (GETINBIBLE_*) are generated into .env by install/update.
  # Moving data from supabase.com: infra/docker/getinbible/README.md
  getinbible:
    build:
      context: .
      dockerfile: infra/docker/getinbible/Dockerfile
      args:
        # Same origin as the app: the server proxies Supabase paths.
        VITE_SUPABASE_URL: ${GETINBIBLE_URL:-http://localhost:3005}
        VITE_SUPABASE_ANON_KEY: ${GETINBIBLE_ANON_KEY:-}
        VITE_OPENAI_ENABLED: ${GETINBIBLE_OPENAI_ENABLED:-true}
        VITE_GEMINI_ENABLED: ${GETINBIBLE_GEMINI_ENABLED:-false}
        VITE_GOOGLE_CLOUD_TTS_ENABLED: ${GETINBIBLE_GOOGLE_CLOUD_TTS_ENABLED:-false}
    image: lightchurch-getinbible:latest
    container_name: lightchurch-getinbible
    restart: unless-stopped
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges
    read_only: true
    mem_limit: 256m
    ports:
      - '127.0.0.1:${LIGHTCHURCH_GETINBIBLE_PORT:-3005}:3005'
    environment:
      # Server-side only — never reach the browser bundle.
      OPENAI_API_KEY: ${GETINBIBLE_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      GEMINI_API_KEY: ${GETINBIBLE_GEMINI_API_KEY:-}
      GOOGLE_CLOUD_TTS_API_KEY: ${GETINBIBLE_GOOGLE_CLOUD_TTS_API_KEY:-}
      # Only this origin may use the AI proxies.
      ALLOWED_ORIGINS: ${GETINBIBLE_URL:-http://localhost:3005}
      SUPABASE_REST_URL: http://getinbible-rest:3000
      SUPABASE_STORAGE_URL: http://getinbible-storage:5000
    depends_on:
      - getinbible-rest
      - getinbible-storage
    networks:
      - default
      - getinbible-internal

  getinbible-db:
    image: supabase/postgres:17.6.1.136
    container_name: lightchurch-getinbible-db
    restart: unless-stopped
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: '5432'
      POSTGRES_PORT: '5432'
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      PGPASSWORD: ${GETINBIBLE_POSTGRES_PASSWORD:?GETINBIBLE_POSTGRES_PASSWORD is required (run update:clawix)}
      POSTGRES_PASSWORD: ${GETINBIBLE_POSTGRES_PASSWORD:?GETINBIBLE_POSTGRES_PASSWORD is required (run update:clawix)}
      JWT_SECRET: ${GETINBIBLE_JWT_SECRET:?GETINBIBLE_JWT_SECRET is required (run update:clawix)}
      JWT_EXP: '3600'
    volumes:
      # First start only: set Supabase role passwords + JWT settings.
      - ./infra/docker/getinbible/supabase/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./infra/docker/getinbible/supabase/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - getinbible_db:/var/lib/postgresql/data
      - getinbible_db_config:/etc/postgresql-custom
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - getinbible-internal

  getinbible-rest:
    image: postgrest/postgrest:v14.12
    container_name: lightchurch-getinbible-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${GETINBIBLE_POSTGRES_PASSWORD}@getinbible-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_JWT_SECRET: ${GETINBIBLE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${GETINBIBLE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: '3600'
    depends_on:
      getinbible-db:
        condition: service_healthy
    networks:
      - getinbible-internal

  getinbible-storage:
    image: supabase/storage-api:v1.60.4
    container_name: lightchurch-getinbible-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${GETINBIBLE_ANON_KEY}
      SERVICE_KEY: ${GETINBIBLE_SERVICE_KEY}
      POSTGREST_URL: http://getinbible-rest:3000
      AUTH_JWT_SECRET: ${GETINBIBLE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${GETINBIBLE_POSTGRES_PASSWORD}@getinbible-db:5432/postgres
      STORAGE_PUBLIC_URL: ${GETINBIBLE_URL:-http://localhost:3005}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - getinbible_storage:/var/lib/storage
    depends_on:
      getinbible-db:
        condition: service_healthy
      getinbible-rest:
        condition: service_started
    networks:
      - getinbible-internal

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_GETINBIBLE_URL: ${GETINBIBLE_URL:-http://localhost:3005}
    image: lightchurch-web:latest
    container_name: lightchurch-web
    restart: unless-stopped
    ports:
      # Host port movable with LIGHTCHURCH_WEB_PORT.
      - '127.0.0.1:${LIGHTCHURCH_WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # Server-rendered /churchweb pages call the API over the compose network.
      API_INTERNAL_URL: http://api:3003
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  getinbible_db:
  getinbible_db_config:
  getinbible_storage:

networks:
  # Get in Bible's Supabase: no internet, no host ports — only the
  # getinbible server reaches it.
  getinbible-internal:
    name: lightchurch-getinbible-internal
    driver: bridge
    internal: true
  # `default` is deliberately left undeclared here so Compose keeps
  # auto-creating it exactly as before (postgres, redis, web stay on it,
  # undisturbed) — only api picks up the two new networks below, by
  # referencing them explicitly in its own `networks:` list.
  clawix-browser-egress:
    # Prefixed (not just `clawix-browser-egress`) because pinned network names,
    # like container_name, are global to the Docker host — an unprefixed name
    # previously collided with another Clawix fork's identically-named network
    # and container names on this machine, silently sharing infra (including
    # its live database) across unrelated projects. `lightchurch-` here must
    # stay unique across every Clawix checkout on this host.
    name: lightchurch-browser-egress
    driver: bridge
    internal: true # blocks traffic from this network to the host/internet
  clawix-browser-net:
    name: lightchurch-browser-net
    driver: bridge
    # External default: this network reaches the public internet by default.
    # RFC1918 blocking is enforced by the deploy environment's firewall rules
    # or a sidecar egress proxy.
