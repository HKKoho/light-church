# Clawix Production Docker Compose
# Usage:
#   Build:  docker compose -f docker-compose.prod.yml build
#   Start:  docker compose -f docker-compose.prod.yml up -d
#   Logs:   docker compose -f docker-compose.prod.yml logs -f
#   Stop:   docker compose -f docker-compose.prod.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: lightchurch-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5443:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clawix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clawix}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lightchurch-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6390:6379'
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    # Project-scoped tag: other Clawix checkouts on the same host use
    # clawix-api:latest, and a shared tag would swap their code for ours.
    image: lightchurch-api:latest
    container_name: lightchurch-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Host port movable with LIGHTCHURCH_API_PORT (scripts read the same var).
      - '127.0.0.1:${LIGHTCHURCH_API_PORT:-3001}:3003'
    env_file: .env
    environment:
      NODE_ENV: production
      # Owner login: used only by entrypoint.sh for migrations and bootstrap.
      DATABASE_URL: postgresql://${POSTGRES_USER:-clawix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-clawix}?schema=public
      # Everyday login the API runs as (rows only, append-only audit log) —
      # see infra/docker/api/db-roles.cjs. Empty password = keep using the owner.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      DATABASE_APP_URL: postgresql://lightchurch_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-clawix}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: '3003'
      HOST: '0.0.0.0'
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?PROVIDER_ENCRYPTION_KEY is required (64 hex chars)}
      # Bootstrap (optional — consumed by dist/bootstrap.js on first start,
      # skipped silently if INITIAL_ADMIN_EMAIL is empty)
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gpt-4o}
      TEMPLATES_DIR: /app/infra/templates
      WORKSPACE_BASE_PATH: /data
      WORKSPACE_HOST_BASE_PATH: ${CLAWIX_HOST_DATA_DIR:-${PWD}/data}
      SKILLS_BUILTIN_DIR: /app/skills/builtin
      SKILLS_BUILTIN_HOST_DIR: ${CLAWIX_HOST_SKILLS_BUILTIN_DIR:-${PWD}/skills/builtin}
      SKILLS_CUSTOM_DIR: /app/skills/custom
      SKILLS_CUSTOM_HOST_DIR: ${CLAWIX_HOST_SKILLS_CUSTOM_DIR:-${PWD}/skills/custom}
      # WhatsApp Baileys auth state — written under the persistent /data mount
      # so the QR pairing survives container restarts.
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
      # Talking Face sidecars — optional; leave the cartoonize service
      # commented out below and this URL unset if you don't need it.
      CARTOONIZE_URL: ${CARTOONIZE_URL:-http://cartoonize:7861}
      # Local model (Ollama) for Roll Call's AI — member names never go to a
      # cloud provider. Inside the container "localhost" is the container, so
      # the default reaches Ollama on the Docker host.
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5vl:7b}
    # Makes host.docker.internal resolve on Linux too (Docker Desktop has it).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./skills/builtin:/app/skills/builtin:ro
      - ./skills/custom:/app/skills/custom
      - ./infra/templates:/app/infra/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - clawix-browser-egress

  clawix-browser:
    image: ghcr.io/browserless/chromium:latest
    container_name: lightchurch-browser
    restart: unless-stopped
    user: '1000:1000'
    # Note: read_only: true breaks Chromium 1217+ — its crashpad handler
    # subprocess loses argv when the rootfs is read-only, causing
    # `chrome_crashpad_handler: --database is required` and aborting launch.
    # Other isolation (non-root user, cap_drop, no-new-privileges, internal
    # egress network, resource limits) still applies.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt:
      - no-new-privileges
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 200
    shm_size: 256m
    environment:
      MAX_CONCURRENT_SESSIONS: '${BROWSER_SIDECAR_MAX_SESSIONS:-25}'
      TOKEN: '${BROWSER_AUTH_TOKEN}'
      # Disable Browserless' built-in queue; we queue at the API layer.
      QUEUED: '0'
      HEALTHCHECK: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - "http://127.0.0.1:3000/active?token=$$TOKEN"']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - clawix-browser-egress
      - clawix-browser-net

  # Optional: selfie -> cartoon/anime portrait for the talking-face pipeline
  # (docs/self2talkface.md). Not started by default — uncomment to enable,
  # and set CARTOONIZE_URL=http://cartoonize:7861 above if you change the
  # default. Build once (~tens of MB of model weights, unlike sadtalker):
  #   docker compose -f docker-compose.prod.yml build cartoonize
  # cartoonize:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/cartoonize/Dockerfile
  #   image: clawix-cartoonize:latest
  #   container_name: lightchurch-cartoonize
  #   restart: unless-stopped
  #   environment:
  #     CARTOONIZE_DEVICE: cpu # or cuda
  #   networks:
  #     - default
  #   # GPU (uncomment if using a CUDA build):
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    image: lightchurch-web:latest
    container_name: lightchurch-web
    restart: unless-stopped
    ports:
      # Host port movable with LIGHTCHURCH_WEB_PORT.
      - '127.0.0.1:${LIGHTCHURCH_WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  # `default` is deliberately left undeclared here so Compose keeps
  # auto-creating it exactly as before (postgres, redis, web stay on it,
  # undisturbed) — only api picks up the two new networks below, by
  # referencing them explicitly in its own `networks:` list.
  clawix-browser-egress:
    # Prefixed (not just `clawix-browser-egress`) because pinned network names,
    # like container_name, are global to the Docker host — an unprefixed name
    # previously collided with another Clawix fork's identically-named network
    # and container names on this machine, silently sharing infra (including
    # its live database) across unrelated projects. `lightchurch-` here must
    # stay unique across every Clawix checkout on this host.
    name: lightchurch-browser-egress
    driver: bridge
    internal: true # blocks traffic from this network to the host/internet
  clawix-browser-net:
    name: lightchurch-browser-net
    driver: bridge
    # External default: this network reaches the public internet by default.
    # RFC1918 blocking is enforced by the deploy environment's firewall rules
    # or a sidecar egress proxy.
